<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="registerstyle.css">
</head>
<body>
   <main>
        <div id="login">
            <header><h1>Register</h1></header>
            <form id="form" action="">
                <input name="username" type="text" placeholder="Username" id="UsernameInput" required>
                <input name="password" type="password" placeholder="Password" id="PasswordInput" required>
                <input name="cPassword" type="password" placeholder="Confirm Password" id="confirmPassword" required>
                <button type="submit" id="submitButton">Submit</button>
            </form>
            <p>have an account? <a href="index.html">Log in</a></p>
        </div>
        
   </main>
   <script src="register.js"></script>
</body>
</html>
