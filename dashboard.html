<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dashboardStyle.css">
</head>
<body class="container">
    <aside>
        <nav id="navSidepanel">
            <div id="headerContainer">
                <button id="backBtn"><img src="icons/arrow_back_ios_new_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                <h2 id="sidePanelHeader">Expense Tracker</h2> 
            </div>
            <ul>
                <li><a href="" class="active"> <img src="icons/home_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> 
                    <p id="list">Home</p></a></li>
                <li><a href="stats.html"> <img src="icons/dashboard_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                    <p id="list">Dashboard</p></a></li>
                <li><a href=""> <img src="icons/account_circle_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                    <p id="list">Profile</p></a></li>
            </ul>
        </nav>
    </aside>
    <script src="sidepanel.js"></script>
    <main>
        <section id="input">
            <div id="balanceContainer">
                <div id="balance">
                    <h1 id="balanceHeader">Balance:</h1>
                    <p id="balanceOutput"></p>
                    <button id="addbalance">Add Balance</button>
                   
                </div>
            </div>
            <div id="savingsContainer">
                <div id="savings">
                    <h1 id="savingsHeader">Savings:</h1>
                    <p id="savingsOutput"></p>
                    <button id="addsavings">Add Savings</button>
                    <button id="withdrawSavings">Withdraw Savings</button>
                   
                </div>
            </div>
            
            <div id="expenseContainer">
                
                <h1 id="expenseHeader">Add Expense</h1>
                <form id="expenseForm" action="">
                    <div id="expenseInputContainer">
                        <div id="expenseInputMain">
                            <label id="expenseInputLabel" for="expenseInput">Amount: </label>
                            <input type="number" name="amount" id="expenseInput" required>
                        </div>
                        <div id="expenseInputMain">
                            <label id="expenseInputLabel" for="expenseInput">Description: </label>
                            <input type="text" name="description" id="expenseDescInput">
                        </div>           
                    </div>
                        <p id="dateInputLabel">Date:</p>
                        <div>   
                            <input id="todayRdbtn" type="radio" name="dateRdBtn" value="dateToday" required >
                            <label for="todayRdbtn">today</label>
                            <input type="radio" name="dateRdBtn" value="chooseDate" required>
                            <input type="date" name="date">
                        </div>
                        
                        
                        <button id="addExpenseBtn" name="expenses" type="submit">Add expense</button>
                    
                </form>
            </div>


        </section>
        <!-- invalid withdraw input popup -->
         <div id="invalidWithdrawContainer" class="close">
            <div class="card">
            <div class="header">
                <div class="image">
                <svg
                    aria-hidden="true"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24"
                    fill="none"
                >
                    <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    ></path>
                </svg>
                </div>
                <div class="content">
                <span class="title">Withdraw Failed</span>
                <p class="message">
                    insufficient balance
                </p>
                </div>
                <div class="actions">
                <button id="invalidWithdrawBtn" class="desactivate" type="button">Confirm</button>
                </div>
            </div>
            </div>
        </div>
        <!-- invalid savings input popup -->
        <div id="invalidSavingsContainer" class="close">
            <div class="card">
            <div class="header">
                <div class="image">
                <svg
                    aria-hidden="true"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24"
                    fill="none"
                >
                    <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    ></path>
                </svg>
                </div>
                <div class="content">
                <span class="title">Savings not added</span>
                <p class="message">
                    insufficient balance
                </p>
                </div>
                <div class="actions">
                <button id="invalidSavingsBtn" class="desactivate" type="button">Confirm</button>
                </div>
            </div>
            </div>
        </div>

        <!-- add savings popup -->
         <div id="savingsModal" class="close">
            <div class="form-container">
                <div class="logo-container">
                    Add Funds to Savings
                </div>

                <form class="form" id="savingsForm">
                    <div class="form-group">
                    <label for="email">Amount</label>
                    <input type="number" id="savingsAmount" name="savingsAmount" placeholder="Enter amount" required="">
                    </div>

                    <button class="form-submit-btn" type="submit">Confirm</button>
                </form>


            </div>
         </div>
         <!-- withdraw savings modal -->
         <div id="withdrawModal" class="close">
            <div class="form-container">
                <div class="logo-container">
                    Withdraw Savings
                </div>

                <form class="form" id="withdrawForm">
                    <div class="form-group">
                    <label for="email">Amount</label>
                    <input type="number" id="withdrawAmount" name="withdrawAmount" placeholder="Enter amount" required="">
                    </div>

                    <button class="form-submit-btn" type="submit">Confirm</button>
                </form>


            </div>
         </div>

        <!-- add balance Popup -->
        <div id="modal" class="close">
            <div id="popupWindow">
                <nav id="navContainer">
                        <button id="popupCloseBtn"><img src="icons/close_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                </nav>
                <div id="addBalanceContainer">
                        <form action="" id="addBalanceForm">
                            <p id="addBalanceHeader">Add Balance</p>
                            <input id="balanceInput" type="number" placeholder="Amount" name="amount" required>
                            <label id="descriptionInputLabel" for="descriptionInput">Description:</label>
                            <input type="text" placeholder="e.g. Allowance" name="description" id="descriptionInput">
                            <div id="balanceDateContainer">   
                                <input id="todayRdbtn" type="radio" name="dateRdBtn" value="dateToday" required >
                                <label for="todayRdbtn">today</label>
                                <input type="radio" name="dateRdBtn" value="chooseDate" required>
                                <input type="date" name="date">
                            </div>
                            <button id="addBalanceBtn" type="submit">Add</button>
                            
                        </form>
                    </div>
                </div>
            </div>           
        </div>
       <!-- edit Balance popUp -->
        <div id="modal2" class="closeEdit">
            <div id="popupWindowEdit">
                <nav id="navContainerEdit">
                        <button id="popupCloseBtnEdit"><img src="icons/close_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                </nav>
                <div id="addBalanceContainerEdit">
                        <form action="" id="addBalanceFormEdit">
                            <p id="addBalanceHeaderEdit">Add Balance</p>
                            <input id="balanceInputEdit" type="number" placeholder="Amount" name="amount" required>
                            <label id="descriptionInputLabelEdit" for="descriptionInput">Description:</label>
                            <input type="text" placeholder="e.g. Allowance" name="description" id="descriptionInputEdit">
                            <div id="balanceDateContainerEdit">   
                                <input id="todayRdbtnEdit" type="radio" name="dateRdBtn" value="dateToday" required >
                                <label for="todayRdbtn">today</label>
                                <input type="radio" name="dateRdBtn" value="chooseDate" required>
                                <input type="date" name="date">
                            </div>
                            <div id="addBalanceBtnContainerEdit">
                                <button id="addBalanceBtnEdit" type="submit">Add</button>
                            
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>           
        </div>
          
        <script src="popup.js"></script>


        <section id="transactions">
            <div id="transactionHeader">
                <h1>Recent Transactions</h1>
            </div>
            <table>
                <thead>
                    <tr id="tableHead">
                        <th><p>Amount</p></th>
                        <th><p>Description</p></th>
                        <th><p>Date</p></th>
                    </tr>
                </thead>
                <tbody id="tableBody">

                </tbody>
            </table>
            <a href="">See More</a>
        </section>

    </main>
    <footer><h1>1</h1></footer>
    <script src="mainScript.js"></script>
</body>
</html>
